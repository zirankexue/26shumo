   <g id="text_1">
    <text style="font-size: 9px; font-family: 'Microsoft YaHei'" transform="translate(214.61811 36.944541)">题给输入与规则核验</text>
    <text style="font-size: 9px; font-family: 'Microsoft YaHei'" transform="translate(182.125298 50.692884)">16节点、3机型、80货箱、原始DEM</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'Microsoft YaHei'" transform="translate(189.318266 105.104464)">局部椭球坐标 + 全相交DEM像元</text>
    <text style="font-size: 9px; font-family: 'Microsoft YaHei'" transform="translate(174.11811 118.852807)">距离、巡航高度、双向爬升、能耗与时间</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9px; font-family: 'Microsoft YaHei'" transform="translate(219.11811 173.264387)">枚举整箱数量组合</text>
    <text style="font-size: 9px; font-family: 'Microsoft YaHei'" transform="translate(167.003891 187.012731)">742个容量可行候选；20%余量下732个候选</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.4px; font-family: 'Microsoft YaHei'" transform="translate(66.151222 258.731434)">数量状态DP</text>
    <text style="font-size: 8.4px; font-family: 'Microsoft YaHei'" transform="translate(58.960035 271.563221)">按(N,E,T)字典序</text>
    <text style="font-size: 8.4px; font-family: 'Microsoft YaHei'" transform="translate(66.994503 284.395009)">基准18架次</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.4px; font-family: 'Microsoft YaHei'" transform="translate(228.349016 258.731434)">非支配标签DP</text>
    <text style="font-size: 8.4px; font-family: 'Microsoft YaHei'" transform="translate(217.31811 271.563221)">逐区求解、全局合并</text>
    <text style="font-size: 8.4px; font-family: 'Microsoft YaHei'" transform="translate(218.783516 284.395009)">完整Pareto前沿2点</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.4px; font-family: 'Microsoft YaHei'" transform="translate(396.315905 258.731434)">精确事件扫描</text>
    <text style="font-size: 8.4px; font-family: 'Microsoft YaHei'" transform="translate(388.927186 271.563221)">110个内部临界值</text>
    <text style="font-size: 8.4px; font-family: 'Microsoft YaHei'" transform="translate(381.515498 284.395009)">111区间 → 19方案段</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9px; font-family: 'Microsoft YaHei'" transform="translate(204.116938 358.089999)">恢复真实箱号 + 独立复核</text>
    <text style="font-size: 9px; font-family: 'Microsoft YaHei'" transform="translate(156.11811 371.838343)">逐箱唯一性、容量、能耗、端点、完整前沿与载荷</text>
    <text style="font-size: 9px; font-family: 'Microsoft YaHei'" transform="translate(192.11811 385.586687)">论文表格、图组与可回查源数据</text>
   </g>
  </g>
